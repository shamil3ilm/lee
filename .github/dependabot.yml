# Weekly dependency updates (review P1-15). Grouped so a week is one PR per
# ecosystem; security updates still arrive on their own as soon as published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major CI runs (setup-node node-version
      # in ci.yml). Bump both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
